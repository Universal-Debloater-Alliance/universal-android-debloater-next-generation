version: 2
updates:
    - package-ecosystem: cargo
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      labels: [dependencies]
      groups:
          cargo:
              update-types: [minor, patch]
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      cooldown:
          default-days: 7
      labels: [dependencies]
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      cooldown:
          default-days: 7
      labels: [dependencies, ci]
