name: Build and release

on:
    push:
        branches:
            - main
        tags:
            - v?[0-9]+.[0-9]+.[0-9]+ # semver
            - "!dev-build" # not dev-build

# Read-only token by default. The release job asks for write access itself.
permissions:
    contents: read

jobs:
    build:
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: $/.github/workflows/build_artifacts.yml
    release:
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-22.04
        needs: build
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Downloads artifacts
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
            - name: Create release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ github.ref_name }}
              run: |
                  notes="${RUNNER_TEMP}/release-notes.md"
                  cat > "${notes}" <<'NOTE'
                  > [!NOTE]
                  > 📦 **Package list updates don't require a new app version**: UAD-ng automatically fetches the latest package definitions on launch (requires internet connection).

                  NOTE
                  gh api --method POST "repos/${GH_REPO}/releases/generate-notes" -f tag_name="${TAG}" --jq .body >> "${notes}"
                  if gh release view "${TAG}" > /dev/null 2>&1; then
                      gh release upload "${TAG}" uad-ng-*/* uad-cli-*/* --clobber
                  else
                      gh release create "${TAG}" uad-ng-*/* uad-cli-*/* --title "${TAG}" --notes-file "${notes}"
                  fi
