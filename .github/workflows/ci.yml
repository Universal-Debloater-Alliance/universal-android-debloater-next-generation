name: Continuous Integration
on:
  push:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - resources/assets/**
      - .cargo/**
      - .github/workflows/**
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - resources/assets/**
      - .cargo/**
      - .github/workflows/**

jobs:
  lint:
    name: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
        lint: [check, test, clippy, fmt]
        exclude: # https://github.com/community/community/discussions/7835
          - os: windows-2022
            lint: clippy
          - os: windows-2022
            lint: fmt
          - os: macos-15
            lint: clippy
          - os: macos-15
            lint: fmt
        include:
          - lint: check
            args: " --workspace --all-targets --all-features --locked"
            env-flag: "-D warnings"
          - lint: test
            args: " --workspace --all-features --locked"
          - lint: clippy
            args: " --workspace --all-targets --all-features --locked -- -D clippy::all -W clippy::style"
          - lint: fmt
            args: " --all -- --check"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target
          key: ${{ runner.os }}-${{ matrix.lint }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.OS }}-${{ matrix.lint }}-
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - shell: bash
        run: RUSTFLAGS='${{ matrix.env-flag }}' cargo ${{ matrix.lint }}${{ matrix.args }}
      - name: Check standalone crate configurations
        if: matrix.lint == 'check'
        shell: bash
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check --all-targets --locked -p uad-core
          cargo check --all-targets --locked -p uad-cli
          cargo check --all-targets --locked -p uad-gui --no-default-features --features wgpu,no-self-update,img

  coverage:
    name: coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Download grcov
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL https://github.com/mozilla/grcov/releases/download/v0.8.19/grcov-x86_64-unknown-linux-gnu.tar.bz2 | tar jxf - -C "${HOME}/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install LLVM-profdata
        run: rustup component add llvm-tools-preview
      - name: Run tests
        run: CARGO_INCREMENTAL=0 RUSTFLAGS='-Cinstrument-coverage' LLVM_PROFILE_FILE='cargo-test-%p-%m.profraw' cargo test --workspace --all-features --locked
      - name: make coverage directory
        run: mkdir -p ./target/coverage
      - name: Run GRCOV
        run: |
          grcov . --binary-path ./target/debug/ -s . -t lcov --branch --ignore-not-existing --ignore '../*' --ignore "/*" -o ./target/coverage/tests.lcov
          # grcov can succeed with an empty report if LLVM tools are missing.
          grep -q '^SF:crates/' ./target/coverage/tests.lcov
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: target/coverage/tests.lcov
          if-no-files-found: error
